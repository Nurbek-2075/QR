  const state=localState(); const save=()=>localStorage.setItem(localStorageKey,JSON.stringify(state)); const user=()=>state.session?{email:state.session}:null;
  const auth={
    getSession:async()=>({data:{session:user()?{user:user()}:null}}),
    getUser:async()=>({data:{user:user()}}),
    signInWithPassword:async({email,password})=>{const a=state.accounts.find(x=>x.email===email&&x.password===password);if(!a)return{data:{},error:{message:'Неверный логин или пароль.'}};state.session=email;save();return{data:{user:{email},session:{user:{email}}},error:null}},

    signOut:async()=>{state.session=null;save();return{error:null}}
  };
  function from(table){let action='select',payload=null,filters=[],sort=null,limitValue=null,start=0,end=Infinity,single=false;
    const builder={
      select:()=>{action='select';return builder}, order:(column,options={})=>{sort={column,ascending:options.ascending!==false};return builder}, eq:(column,value)=>{filters.push(x=>String(x[column])===String(value));return builder}, gte:(column,value)=>{filters.push(x=>String(x[column])>=String(value));return builder}, lt:(column,value)=>{filters.push(x=>String(x[column])<String(value));return builder}, limit:(n)=>{limitValue=n;return builder}, range:(a,b)=>{start=a;end=b;return builder}, maybeSingle:()=>{single=true;return builder}, insert:(rows)=>{action='insert';payload=Array.isArray(rows)?rows:[rows];return builder}, update:(values)=>{action='update';payload=values;return builder}, delete:()=>{action='delete';return builder},
      then:(resolve,reject)=>execute().then(resolve,reject)
    };
    async function execute(){try{if(!state[table])state[table]=[];let rows=state[table];if(action==='insert'){const added=payload.map(item=>({...item,id:item.id||localId(),created_at:item.created_at||localNow()}));rows.push(...added);save();return{data:added,error:null}}if(action==='update'){rows.forEach(row=>{if(filters.every(f=>f(row)))Object.assign(row,payload)});save();return{data:null,error:null}}if(action==='delete'){state[table]=rows.filter(row=>!filters.every(f=>f(row)));save();return{data:null,error:null}}let result=rows.filter(row=>filters.every(f=>f(row)));if(sort)result.sort((a,b)=>{const av=String(a[sort.column]??''),bv=String(b[sort.column]??'');return(sort.ascending?1:-1)*av.localeCompare(bv)});if(limitValue!==null)result=result.slice(0,limitValue);result=result.slice(start,end===Infinity?undefined:end+1);return{data:single?(result[0]||null):result,error:null}}catch(error){return{data:null,error}}}
    return builder;
  }
  return {auth,from,rpc:async(name,args)=>{
    if(name==='is_login_allowed'){
      const email=toEmail(normalizeLogin(args.p_login)); 
      return{data:state.participants.some(p=>String(p.email).toLowerCase()===email)||state.allowed_admins.some(a=>String(a.email).toLowerCase()===email),error:null};
    }
    if(name==='is_participant_login_allowed'){
      const email=toEmail(normalizeLogin(args.p_login));
      return{data:state.participants.some(p=>String(p.email).toLowerCase()===email),error:null};
    }
    if(name==='is_admin_login_allowed'){
      const email=toEmail(normalizeLogin(args.p_login));
      return{data:state.allowed_admins.some(a=>String(a.email).toLowerCase()===email),error:null};
    }
    if(name==='participant_attendance_rate'){const p=state.participants.find(x=>x.email===state.session),cutoff=p?.created_at?.slice(0,10)||'0000-00-00',active=new Set(state.checkins.filter(c=>c.day>=cutoff).map(c=>c.day)).size,own=new Set(state.checkins.filter(c=>c.participant_id===p?.id).map(c=>c.day)).size;return{data:active?Math.round(own*100/active):0,error:null}}
    if(name!=='check_in_for_user')return{data:null,error:{message:'Неизвестная локальная функция'}};
    const token=state.qr_tokens.find(x=>x.token===args.p_token&&new Date(x.expires_at)>new Date());

    return{data:'ok:'+p.name,error:null}
  }};
}

  async kpi(){const W=26,end=new Date();end.setHours(0,0,0,0);const start=new Date(end);start.setDate(start.getDate()-((end.getDay()+6)%7)-(W-1)*7);const [rawPs,rawCs]=await Promise.all([sb.from('participants').select('id,name,email,owner_email').then(must),fetchAll(()=>sb.from('checkins').select('participant_id,day').gte('day',iso(start)).order('day'))]);const ps=visibleParticipants(rawPs),ids=new Set(ps.map(p=>p.id)),cs=rawCs.filter(c=>ids.has(c.participant_id));const sessions=new Set(cs.map(c=>c.day)),by={};cs.forEach(c=>(by[c.participant_id]||=[]).push(c.day));const rows=ps.map(p=>({...p,n:new Set(by[p.id]||[]).size})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));const days=[];for(let d=new Date(start);d<=new Date(end.getTime()+6*864e5);d.setDate(d.getDate()+1))days.push(iso(d));const total=sessions.size,last=iso(end);box.innerHTML=`<div class="actions"><h2 style="margin-right:auto">Последние ${W} недель</h2><button id="export">Скачать Excel</button></div><div class="legend"><span><i style="background:var(--g)"></i>Пришёл</span><span><i style="background:var(--body)"></i>Пропустил</span><span><i style="background:var(--n)"></i>Занятий не было</span></div>`+(rows.length?rows.map((r,i)=>`<div class="kpi"><div class="who"><b>${i+1}. ${esc(r.name)}</b><span class="muted">${total?Math.round(r.n/total*100):0}% · ${r.n} из ${total} дней</span></div><div class="scroll"><div class="heat">${days.map(d=>`<i class="${d>last?'x':(by[r.id]||[]).includes(d)?'g':sessions.has(d)?'r':''}" title="${d}"></i>`).join('')}</div></div></div>`).join(''):'<p class="empty">Данных пока нет.</p>');$('#export').onclick=()=>exportAll()},
  async admins(){

async function boot(){
  try{
    if(!LOCAL_MODE&&!SUPABASE_CONFIGURED)return configView();
    const token=new URLSearchParams(location.search).get('t');
    if(token)return tokenView(token);
    const {data:{session}}=await sb.auth.getSession();
    if(!session)return entryView();
    const email=session.user.email.toLowerCase();
    const admin=must(await sb.from('allowed_admins').select('*').eq('email',email).maybeSingle());
    if(admin){ME=admin;return shell()}
    const participant=must(await sb.from('participants').select('id').eq('email',email).maybeSingle());
    if(participant)return participantHome();
    view(`<main class="narrow"><h1>Нет доступа</h1><p class="muted">Логин не найден среди участников или администраторов.</p><button id="out">Выйти</button></main>`);
    $('#out').onclick=signOutToEntry;
  }catch(e){showError(e)}
}
boot();

<script>
